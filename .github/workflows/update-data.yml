name: Update Disposable Email Data

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history + tags, needed to compute next version
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Update data
        run: >
          go run ./cmd/disposable-update
          -o ./data -v
          -summary /tmp/update-summary.txt
          -changelog /tmp/changelog

      - name: Check for changes
        id: check
        run: |
          # Read the summary to determine if there were actual domain changes
          SUMMARY="no changes"
          if [ -f /tmp/update-summary.txt ]; then
            SUMMARY=$(cat /tmp/update-summary.txt)
          fi

          echo "Summary: $SUMMARY"

          # Check if summary indicates actual changes (not "no changes")
          if [ "$SUMMARY" = "no changes" ]; then
            echo "No domain changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Domain changes detected: $SUMMARY"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          fi

      - name: Validate file size
        if: steps.check.outputs.changed == 'true'
        run: |
          FILE_SIZE=$(stat -c%s data/data.bin 2>/dev/null || stat -f%z data/data.bin)
          echo "File size: $FILE_SIZE bytes"

          # Minimum expected size is 100KB (100000 bytes)
          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "ERROR: data.bin is too small ($FILE_SIZE bytes). Expected at least 100KB."
            echo "This might indicate a corrupted file. Aborting commit."
            exit 1
          fi

          echo "File size validation passed"

      - name: Commit and push changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.bin
          git commit -m "chore: weekly update - ${{ steps.check.outputs.summary }}"
          git push

      - name: Compute next version
        if: steps.check.outputs.changed == 'true'
        id: version
        run: |
          # Highest existing vMAJOR.MINOR.PATCH tag; default to v0.0.0 if none.
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "Latest tag: $LATEST"

          VERSION=${LATEST#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Guard against non-numeric components (e.g. pre-release suffixes).
          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "ERROR: latest tag '$LATEST' is not a plain vMAJOR.MINOR.PATCH version."
            exit 1
          fi

          NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "Next version: $NEXT"
          echo "next=$NEXT" >> $GITHUB_OUTPUT

      - name: Create release
        if: steps.check.outputs.changed == 'true'
        env:
          # GITHUB_TOKEN-created tags do not re-trigger the tag-push release
          # workflow, so this will not create a duplicate release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.next }}" \
            --title "${{ steps.version.outputs.next }}" \
            --notes-file /tmp/changelog/notes.md \
            --target "$(git rev-parse HEAD)" \
            data/data.bin \
            /tmp/changelog/added.txt \
            /tmp/changelog/removed.txt

      - name: Skip notification
        if: steps.check.outputs.changed == 'false'
        run: echo "No changes to commit - data.bin is already up to date"
